<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tender Cards — Toegang</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231C3A2E'/%3E%3Crect x='5' y='7' width='14' height='18' rx='2.5' fill='none' stroke='%23C4963D' stroke-width='1.2'/%3E%3Crect x='13' y='9' width='14' height='18' rx='2.5' fill='none' stroke='rgba(196,150,61,0.35)' stroke-width='1'/%3E%3Cpath d='M12 20.5C12 20.5 7.5 17 7.5 13.8C7.5 12.1 8.9 10.8 10.5 10.8C11.3 10.8 12 11.2 12 11.7C12 11.2 12.7 10.8 13.5 10.8C15.1 10.8 16.5 12.1 16.5 13.8C16.5 17 12 20.5 12 20.5Z' fill='%23C4963D'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'DM Sans', sans-serif;
      background: #111916;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Subtle background pattern */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse at 20% 50%, rgba(28,58,46,0.6) 0%, transparent 60%),
        radial-gradient(ellipse at 80% 30%, rgba(196,150,61,0.06) 0%, transparent 50%);
      pointer-events: none;
    }

    .login-card {
      position: relative;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 18px;
      padding: 3rem 3rem 2.5rem;
      width: 100%;
      max-width: 380px;
      margin: 1.5rem;
      box-shadow: 0 40px 80px rgba(0,0,0,0.5);
      animation: fadeUp 0.55s cubic-bezier(0.32,0.72,0,1) both;
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Gold foil top */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 10%; right: 10%;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(196,150,61,0.6) 40%, rgba(232,180,88,0.8) 50%, rgba(196,150,61,0.6) 60%, transparent);
    }

    .login-logo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      margin-bottom: 2rem;
    }
    .login-logo svg { margin-bottom: 0.75rem; }
    .login-logo-tender {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 600;
      color: #fff;
      letter-spacing: 0.05em;
      line-height: 1;
    }
    .login-logo-cards {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.5rem;
      font-weight: 300;
      color: #C4963D;
      letter-spacing: 0.12em;
      line-height: 1;
    }
    .login-tagline {
      font-size: 0.72rem;
      color: rgba(255,255,255,0.25);
      letter-spacing: 0.08em;
      margin-top: 0.5rem;
    }

    .login-divider {
      width: 32px; height: 0.5px;
      background: rgba(196,150,61,0.3);
      margin: 0 auto 2rem;
    }

    label {
      display: block;
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.35);
      margin-bottom: 0.6rem;
    }

    .input-wrap {
      position: relative;
      margin-bottom: 1.25rem;
    }

    input[type="password"] {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 0.8rem 2.8rem 0.8rem 1rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: #fff;
      letter-spacing: 0.2em;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
    }
    input[type="password"]::placeholder { letter-spacing: 0.05em; color: rgba(255,255,255,0.2); }
    input[type="password"]:focus {
      border-color: rgba(196,150,61,0.4);
      background: rgba(255,255,255,0.06);
    }
    input[type="password"].error {
      border-color: rgba(200,60,60,0.5);
      animation: shake 0.35s cubic-bezier(0.36,0.07,0.19,0.97);
    }
    @keyframes shake {
      0%,100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    /* Toggle visibility icon */
    .toggle-pw {
      position: absolute;
      right: 0.9rem;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      color: rgba(255,255,255,0.25);
      padding: 0;
      display: flex;
      transition: color 0.2s;
    }
    .toggle-pw:hover { color: rgba(255,255,255,0.55); }

    .error-msg {
      font-size: 0.75rem;
      color: rgba(200,80,80,0.85);
      margin-top: -0.75rem;
      margin-bottom: 1rem;
      display: none;
    }
    .error-msg.visible { display: block; }

    button[type="submit"] {
      width: 100%;
      background: #1C3A2E;
      border: 1px solid rgba(196,150,61,0.25);
      border-radius: 100px;
      padding: 0.85rem;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      font-weight: 500;
      color: rgba(255,255,255,0.88);
      cursor: pointer;
      transition: background 0.2s, border-color 0.2s, transform 0.15s;
      letter-spacing: 0.04em;
    }
    button[type="submit"]:hover {
      background: #244B3B;
      border-color: rgba(196,150,61,0.45);
      transform: translateY(-1px);
    }
    button[type="submit"]:active { transform: translateY(0); }

    .login-footer {
      text-align: center;
      margin-top: 1.75rem;
      font-size: 0.68rem;
      color: rgba(255,255,255,0.15);
    }
  </style>
</head>
<body>

<div class="login-card">
  <div class="login-logo">
    <svg width="36" height="44" viewBox="0 0 36 44" fill="none">
      <rect x="1" y="1" width="22" height="34" rx="3.5" fill="none" stroke="#C4963D" stroke-width="1.4"/>
      <rect x="12" y="5" width="22" height="34" rx="3.5" fill="none" stroke="rgba(196,150,61,0.25)" stroke-width="1"/>
      <path d="M12 27C12 27 5 22.5 5 17.8C5 15.2 7.1 13 9.5 13c1.2 0 2.3.6 3 1.5.7-.9 1.8-1.5 3-1.5 2.4 0 4.5 2.2 4.5 4.8C20 22.5 12 27 12 27Z" fill="#C4963D"/>
    </svg>
    <div class="login-logo-tender">Tender</div>
    <div class="login-logo-cards">Cards</div>
    <div class="login-tagline">Besloten omgeving</div>
  </div>

  <div class="login-divider"></div>

  <form id="loginForm" onsubmit="checkPassword(event)">
    <label for="pw">Toegangscode</label>
    <div class="input-wrap">
      <input type="password" id="pw" placeholder="Voer wachtwoord in" autocomplete="current-password" autofocus>
      <button type="button" class="toggle-pw" onclick="toggleVisibility()" aria-label="Toon wachtwoord">
        <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
        </svg>
      </button>
    </div>
    <div class="error-msg" id="errorMsg">Onjuist wachtwoord. Probeer opnieuw.</div>
    <button type="submit">Toegang →</button>
  </form>

  <div class="login-footer">Tender Cards B.V. · Besloten preview</div>
</div>

<script>
  // If already authenticated, go straight to site
  if (sessionStorage.getItem('tc_auth') === 'ok') {
    window.location.replace('index.html');
  }

  function checkPassword(e) {
    e.preventDefault();
    const input = document.getElementById('pw');
    const errorMsg = document.getElementById('errorMsg');

    if (input.value === '34782222') {
      sessionStorage.setItem('tc_auth', 'ok');
      window.location.replace('index.html');
    } else {
      input.classList.add('error');
      errorMsg.classList.add('visible');
      setTimeout(() => input.classList.remove('error'), 400);
      input.value = '';
      input.focus();
    }
  }

  function toggleVisibility() {
    const input = document.getElementById('pw');
    const icon = document.getElementById('eyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.innerHTML = '<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23" stroke-linecap="round"/>';
    } else {
      input.type = 'password';
      icon.innerHTML = '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    }
  }
</script>

</body>
</html>
